name: Release

# Publishes to PyPI when a version tag (e.g. v1.0.0) is pushed.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token or secret is stored in
# the repo. One-time setup on PyPI: create the "kql-cli" project's trusted
# publisher pointing at this repo, workflow "release.yml", environment "pypi".
# See: https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
